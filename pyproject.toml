# 僅存放工具設定（ruff / pytest）。
# 相依套件不放這裡：執行相依見 requirements.txt，開發相依見 requirements-dev.txt。

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E,F = pyflakes / pycodestyle   I = isort         B = flake8-bugbear
# UP  = pyupgrade                ASYNC = async 陷阱  SIM = flake8-simplify
# C4  = comprehensions           N = pep8-naming   RUF = ruff 專屬規則
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "C4", "N", "RUF"]
ignore = [
    "B008",  # FastAPI 的 Depends() 放在預設參數是正常用法
    # 本專案 docstring/註解刻意用中文，全形標點（，：；（）／…）是正常書寫，
    # 非「混進程式碼的歧義字元」。RUF001/002/003 的前提是純 ASCII 原始碼，與此慣例衝突，故關閉。
    "RUF001",  # 字串中的歧義 unicode
    "RUF002",  # docstring 中的歧義 unicode
    "RUF003",  # 註解中的歧義 unicode
]

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["app", "scripts"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
