# 僅存放工具設定（ruff / pytest）。
# 相依套件不放這裡：執行相依見 requirements.txt，開發相依見 requirements-dev.txt。

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E,F = pyflakes / pycodestyle   I = isort         B = flake8-bugbear
# UP  = pyupgrade                ASYNC = async 陷阱  SIM = flake8-simplify
# C4  = comprehensions           N = pep8-naming   RUF = ruff 專屬規則
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "C4", "N", "RUF"]
ignore = [
    "B008",  # FastAPI 的 Depends() 放在預設參數是正常用法
]

[tool.ruff.lint.isort]
force-single-line = false
known-first-party = ["app", "scripts"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
